name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare clean website artifact
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '.htaccess' \
            --exclude 'ESKI-DOMAIN-301.htaccess.txt' \
            --exclude 'MAHALLE-URL-LISTESI.csv' \
            --exclude 'SEO-UYGULAMA-PLANI.md' \
            --exclude 'YUKLEME-TALIMATI.md'
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/sitemap-core.xml
          test -f _site/assets/css/style.css
          test -f _site/assets/js/main.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
